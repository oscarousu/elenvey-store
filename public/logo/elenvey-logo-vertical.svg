        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 32px;
        font-weight: 400;
        letter-spacing: 0.32em;
        fill: #2A2A2A;
        text-anchor: middle;
      }
      .vert-sub {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 11.5px;
        font-weight: 600;
        letter-spacing: 0.32em;
        fill: #8C7661;
        text-anchor: middle;
