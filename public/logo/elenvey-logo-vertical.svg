  <!-- Centered Fluid Thread Mark -->
  <g transform="translate(65, 12) scale(0.9)">
    <path d="M 30,95 C 50,95 65,92 78,85 C 92,76 108,52 132,42 C 152,34 172,42 166,66 C 158,96 116,132 86,132 C 60,132 46,112 56,92 C 66,72 98,64 126,74 C 154,84 174,106 186,104 C 196,102 202,88 195,78 C 188,68 174,72 176,86 C 178,98 194,104 206,94 C 214,86 216,72 210,64" 
